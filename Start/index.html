<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d6b4f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>BizAI Africa</title></head><body>
<header><div class="brand">BizAI <span>Africa</span></div><div id="sync" class="sync">● Synced</div></header>
<main>
<section id="setup" class="setup"><div class="intro"><p class="eyebrow">YOUR BUSINESS, CLEARLY</p><h1>Run your business smarter.</h1><p>An offline-friendly business companion built around how African SMEs work.</p></div><form id="businessForm" class="card"><h2>Set up your business</h2><label>Business name<input required id="bizName" placeholder="e.g. Amina's Shop"></label><label>Business type<select id="bizType"><option>Retail</option><option>Restaurant</option><option>Salon/barbershop</option><option>Professional services</option><option>Agriculture</option><option>Other</option></select></label><label>Country<select id="country"><option value="KE">Kenya</option><option value="UG">Uganda</option><option value="TZ">Tanzania</option><option value="RW">Rwanda</option><option value="NG">Nigeria</option><option value="GH">Ghana</option><option value="ZA">South Africa</option></select></label><label>Base currency<select id="currency"><option value="KES">KES — Kenyan shilling</option><option>UGX</option><option>TZS</option><option>RWF</option><option>NGN</option><option>GHS</option><option>ZAR</option><option>USD</option></select></label><button>Start my business</button><button type="button" class="secondary" id="demo">Try demo business</button></form></section>
<section id="app" hidden><nav><button data-view="home" class="active">Home</button><button data-view="sales">Sales</button><button data-view="inventory">Inventory</button><button data-view="customers">Customers</button><button data-view="expenses">Expenses</button><button data-view="reports">Reports</button><button data-view="assistant">AI Assistant</button><button data-view="feedback">Feedback</button></nav>
<div id="view"></div></section>
</main><dialog id="modal"></dialog><script src="app.js"></script></body></html>
